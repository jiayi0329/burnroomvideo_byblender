services:
  app-server:
    image: burnroom-app:latest  # 直接使用打包好的镜像，不再现场 build
    restart: always
    gpus: all                   # 使用宿主机 NVIDIA GPU (需已装 nvidia-container-toolkit)
    ports:
      - "8000:8000"
    env_file:
      - prod.env                # 引用生产环境的专属密码文件 (含 MINIO_ROOT_USER/PASSWORD)
    environment:
      # MinIO 数据流转连接配置 (凭证由 prod.env 注入容器)
      - MINIO_ENDPOINT=minio-oss:9000
      # 产物公开分享链接使用的对外端点 (V6.0 老师看片入口, 需管理员放行 9000 端口)
      - MINIO_PUBLIC_ENDPOINT=http://172.25.76.201:9000
    depends_on:
      - minio-oss
    volumes:
      # 场景资产与渲染产物落服务器独立数据盘, 容器重建不丢
      - /data/zhaojy/burnroom-data/app-data:/app/data
      
  minio-oss:
    image: docker.1panel.live/minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - /data/zhaojy/burnroom-data/minio:/data  # 生产环境建议挂载到服务器的绝对路径下

  postgres:
    image: postgres:16
    restart: unless-stopped
    # 不发布 5432，后端通过 Compose 网络访问。
    environment:
      POSTGRES_DB: burnroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in remote .env}
    volumes:
      - /data/zhaojy/burnroom-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d burnroom"]
      interval: 10s
      timeout: 5s
      retries: 10
