services:
  app-server:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Windows 挂载目录下强制轮询文件变化，保证热更新生效
      - WATCHFILES_FORCE_POLLING=true
      # MinIO 数据流转连接配置 (凭证与 minio-oss 服务共用项目 .env)
      - MINIO_ENDPOINT=minio-oss:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin_blender}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # 产物公开分享链接使用的对外端点 (本地开发指向 localhost)
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
    depends_on:
      - minio-oss
    volumes:
      # 挂载本地代码目录，方便你改代码时热更新
      - .:/app
      
  minio-oss:
    # 替换为国内代理镜像源，解决服务器拉取失败问题
    image: docker.1panel.live/minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"   # API 接口端口 (代码调用)
      - "9001:9001"   # Web 管理后台端口 (浏览器查看)
    environment:
      # 规范：不在编排文件里写死明文密码，统一从 .env 读取
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_blender}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      # 将云端数据映射到本机的 minio_data 文件夹，保证重启不丢
      - ./minio_data:/data