# Apply with the EXISTING remote compose file; never replace its env/volumes.
services:
  app-server:
    runtime: nvidia
    # Clear gpus: all inherited from the EXISTING remote compose file.
    # Use the runtime + environment path verified on the server instead.
    gpus: !reset []
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
