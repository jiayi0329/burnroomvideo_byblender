services:
  app-server:
    image: burnroom-app:latest  # 直接使用打包好的镜像，不再现场 build
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - prod.env                # 引用生产环境的专属密码文件
    depends_on:
      - minio-oss
      
  minio-oss:
    image: docker.1panel.live/minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - /data/zhaojy/burnroom-data/minio:/data  # 生产环境建议挂载到服务器的绝对路径下